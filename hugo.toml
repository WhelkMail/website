baseURL = "https://whelkmail.eu/"
languageCode = "en"
title = "WhelkMail — self-hosted webmail for the mailboxes you own"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
description = "WhelkMail is a self-hosted webmail client for IMAP and SMTP accounts you already own. Deploy on Cloudflare Workers, Pages or Docker. Privacy-first, MIT licensed."
ogTitle = "WhelkMail — one calm inbox for every mailbox"
ogDescription = "A self-hosted webmail client for IMAP/SMTP accounts, deployable on Cloudflare Workers, Pages or Docker."
ogImage = "screenshots/inbox.png"
ogImageAlt = "WhelkMail inbox showing multiple accounts, shared labels and a message list"
ogLocale = "en_US"
themeColor = "#c5221f"
notFoundTitle = "Page not found — WhelkMail"
githubRepo = "https://github.com/WhelkMail/WhelkMail"
docsURL = "https://docs.whelkmail.eu/getting-started/"
demoURL = "https://demo.whelkmail.eu"
installerRepo = "https://github.com/WhelkMail/installer"
installerURL = "https://github.com/WhelkMail/installer#readme"
deployURL = "https://docs.whelkmail.eu/deployment/"
privacyController = "WhelkMail"
privacyEmail = "info@whelkmail.eu"
privacyCountry = "Italy"
privacyAuthority = "Garante per la protezione dei dati personali"
privacyAuthorityURL = "https://www.garanteprivacy.it/"

[sitemap]
changefreq = "monthly"
priority = 1.0

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^GTM_']
