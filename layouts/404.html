<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <main class="notfound wrap">
      <p class="eyebrow">404</p>
      <h1>This mailbox moved.</h1>
      <p class="lede">The page you are looking for does not exist. The inbox is this way.</p>
      <div class="actions">
        <a class="button" href="{{ "/" | relURL }}">Back home</a>
        <a class="button button-ghost" href="https://github.com/WhelkMail/WhelkMail">View on GitHub</a>
      </div>
    </main>
  </body>
</html>
