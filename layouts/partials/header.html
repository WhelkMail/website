<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="WhelkMail home">
      <img src="{{ "logo.svg" | relURL }}" width="28" height="28" alt="" />
      <span>WhelkMail</span>
    </a>
    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="#try">Demo</a>
      <a href="#features">Features</a>
      <a href="#screenshots">Screenshots</a>
      <a href="#security">Security</a>
      <a href="#deploy">Deploy</a>
      <a href="{{ site.Params.docsURL }}" target="_blank" rel="noopener">Docs</a>
      <a href="https://github.com/WhelkMail/WhelkMail">GitHub</a>
      <a class="nav-deploy" href="{{ site.Params.deployURL }}">Deploy your own</a>
    </nav>
    <a class="button button-small button-deploy" href="{{ site.Params.deployURL }}">
      Deploy your own
    </a>
  </div>
</header>
<script>
  (() => {
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.getElementById("site-nav");
    if (!toggle || !nav) return;

    const close = () => {
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "Open menu");
      nav.classList.remove("is-open");
    };

    toggle.addEventListener("click", () => {
      const open = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!open));
      toggle.setAttribute("aria-label", open ? "Open menu" : "Close menu");
      nav.classList.toggle("is-open", !open);
    });

    nav.addEventListener("click", (event) => {
      if (event.target.closest("a")) close();
    });

    document.addEventListener("click", (event) => {
      if (!nav.contains(event.target) && !toggle.contains(event.target)) close();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        close();
        toggle.focus();
      }
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 860) close();
    });
  })();
</script>
