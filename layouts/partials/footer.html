<footer class="site-footer">
  <div class="wrap footer-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "logo.svg" | relURL }}" width="24" height="24" alt="" />
      <span>WhelkMail</span>
    </a>
    <p>Self-hosted webmail for the mailboxes you already own.</p>
    <nav aria-label="Footer">
      <a href="{{ site.Params.demoURL }}" target="_blank" rel="noopener">Demo</a>
      <a href="{{ site.Params.installerRepo }}">Installer (beta)</a>
      <a href="{{ site.Params.githubRepo }}">{{ partial "icon-github.html" . }}<span>GitHub</span></a>
      <a href="{{ site.Params.docsURL }}" target="_blank" rel="noopener">Documentation</a>
      <a href="https://github.com/WhelkMail/WhelkMail/blob/main/LICENSE">MIT License</a>
      <a href="{{ "privacy/" | relURL }}">Privacy</a>
      <a href="{{ "cookies/" | relURL }}">Cookies</a>
      <button type="button" class="linklike" data-consent-open>Cookie settings</button>
    </nav>
  </div>
</footer>
